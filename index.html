<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Tareas</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet"> <!-- Font Awesome -->
</head>
<body>

    <div id="message-container" class="hidden"></div> <!-- Mensajes -->

    <div id="auth-container">
        <div id="login-form" class="card">
            <h2>Iniciar Sesión</h2>
            <input type="email" id="login-email" placeholder="Correo electrónico">
            <input type="password" id="login-password" placeholder="Contraseña">
            <button onclick="login()">Ingresar</button>
            <p>¿No tienes cuenta? <a href="#" onclick="toggleForms()">Regístrate</a></p>
        </div>

        <div id="register-form" class="card hidden">
            <h2>Registro</h2>
            <input type="text" id="register-name" placeholder="Nombre">
            <input type="email" id="register-email" placeholder="Correo electrónico">
            <input type="password" id="register-password" placeholder="Contraseña (mín. 6 caracteres)">
            <button onclick="register()">Registrarse</button>
            <p>¿Ya tienes cuenta? <a href="#" onclick="toggleForms()">Inicia sesión</a></p>
        </div>
    </div>

    <div id="app-container" class="hidden">
        <h2>Lista de Tareas</h2>
        <button onclick="logout()">Cerrar Sesión</button>
        <input type="text" id="task-title" placeholder="Título de la tarea">
        <input type="text" id="task-desc" placeholder="Descripción">
        <button onclick="addTask()">Agregar</button>

        <table>
            <thead>
                <tr>
                    <th>Autor</th>
                    <th>Título</th>
                    <th>Descripción</th>
                    <th>B</th>
                </tr>
            </thead>
            <tbody id="task-list"></tbody>
        </table>
    </div>

    <script src="script.js"></script>
</body>
</html>
